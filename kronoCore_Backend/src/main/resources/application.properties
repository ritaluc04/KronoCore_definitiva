# URL base del frontend web para construir el enlace de verificacion
# En Azure App Service, define FRONTEND_CONFIRMATION_URL y FRONTEND_INVITATION_URL
# con la URL pública del frontend web que maneja la confirmación / invitación.
app.frontend-confirmation-url=${FRONTEND_CONFIRMATION_URL:http://localhost:5500/login/login.html}
# URL base del frontend web para construir el enlace de invitación
app.frontend-invitation-url=${FRONTEND_INVITATION_URL:http://localhost:5500/login/login.html}

