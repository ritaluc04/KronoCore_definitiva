# Configuracion de Servidor
server.port=8081
# Permitir que el servidor escuche en todas las interfaces (útil para emuladores/dispositivos remotos)
server.address=0.0.0.0

# Configuracion de Base de Datos H2 (En Memoria para Desarrollo)
# Permite que la app funcione sin instalar PostgreSQL ahora mismo.
spring.datasource.url=jdbc:h2:mem:kronocore;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilitar consola H2 para depurar (acceso en /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Configuracion JPA / Hibernate
# 'update' crea las tablas automaticamente si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Deshabilitar seguridad basica temporalmente para facilitar las pruebas iniciales
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

