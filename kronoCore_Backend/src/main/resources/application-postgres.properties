# ==============================================================================
# Perfil Spring: postgres
# Activa con:  --spring.profiles.active=postgres
# O con el script: run_krono_backend_postgres.bat
#
# Sustituye la configuración H2 de application.properties cuando este perfil
# está activo (mismas claves, valores de PostgreSQL).
# ==============================================================================

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:192.168.0.251}:${POSTGRES_PORT:25060}/${POSTGRES_DB:kronocore}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Recomendado en PostgreSQL con tipos LOB / algunos drivers JDBC
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# La consola H2 no aplica con este perfil
spring.h2.console.enabled=false
