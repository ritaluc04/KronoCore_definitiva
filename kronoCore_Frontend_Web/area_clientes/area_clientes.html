<!-- =============================================================================
     Área de Clientes — KronoCore Frontend Web
     Vista del cliente: próximas citas y compras recientes.
     ============================================================================= -->
<!DOCTYPE html>
<html lang="es">
<!-- —— Cabecera del documento: meta, título y hojas de estilo —— -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronoCore · Mis citas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="../global/css/kons.css" rel="stylesheet" />
  <link href="../global/css/kons_app_theme.css" rel="stylesheet" />
  <link href="../global/css/krono_widgets.css" rel="stylesheet" />
  <link href="../global/css/app_layout.css" rel="stylesheet" />
  <link href="css/area_clientes.css" rel="stylesheet" />
</head>
<body class="krono-app" data-route="/area-cliente">
  <!-- Shell de navegación lateral (inyectado por app_layout.js) -->
  <div id="app-shell-mount"></div>
  <!-- Contenido principal del área de cliente -->
  <div id="page-content">
    <div class="MisCitasScreen krono-scroll-page">
      <!-- Sección: próximas citas del cliente -->
      <h2 class="krono-headline-medium">Mis citas</h2>
      <p class="text-muted mb-3">Próximas reservas y solicitudes</p>
      <div id="misCitasList"></div>
      <!-- Sección: historial de compras recientes -->
      <div class="mt-4">
        <h3 class="krono-title-medium mb-2">Compras recientes</h3>
        <div id="misComprasList"></div>
      </div>
    </div>
  </div>

  <!-- Dependencias globales y controlador de la pantalla -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../global/js/models.js"></script>
  <script src="../global/js/api_client.js"></script>
  <script src="../global/js/session.js"></script>
  <script src="../global/js/krono_widgets.js"></script>
  <script src="../global/js/app_layout.js"></script>
  <script src="js/area_clientes_screen_controller.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAppShell();
      initMisCitasScreen();
    });
  </script>
</body>
</html>
