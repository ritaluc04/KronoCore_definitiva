<!-- =============================================================================
     Pantalla de Ajustes — KronoCore Frontend Web
     Perfil de usuario, seguridad, preferencias y acceso a gestión de usuarios.
     ============================================================================= -->
<!DOCTYPE html>
<html lang="es">
<!-- —— Cabecera del documento: meta, título y hojas de estilo —— -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronoCore · Ajustes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="../global/css/kons.css" rel="stylesheet" />
  <link href="../global/css/kons_app_theme.css" rel="stylesheet" />
  <link href="../global/css/krono_widgets.css" rel="stylesheet" />
  <link href="../global/css/app_layout.css" rel="stylesheet" />
  <link href="css/ajustes.css" rel="stylesheet" />
</head>
<body class="krono-app" data-route="/ajustes">
  <!-- Shell de navegación lateral (inyectado por app_layout.js) -->
  <div id="app-shell-mount"></div>
<!-- Contenido de ajustes (renderizado dinámicamente por ajustes_screen_controller.js) -->
  <div id="page-content">
    <div class="AjustesScreen krono-scroll-page" id="ajustesRoot"></div>
  </div>

  <!-- Dependencias globales y controlador de la pantalla -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../global/js/models.js"></script>
  <script src="../global/js/session.js"></script>
  <script src="../global/js/krono_widgets.js"></script>
  <script src="../global/js/app_layout.js"></script>
<script src="js/ajustes_screen_controller.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAppShell();
      initAjustesScreen();
    });
  </script>
</body>
</html>
