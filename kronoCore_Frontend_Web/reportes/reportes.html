<!-- =============================================================================
     Pantalla de Informes — KronoCore Frontend Web
     Métricas resumidas y exportación de datos a CSV.
     ============================================================================= -->
<!DOCTYPE html>
<html lang="es">
<!-- —— Cabecera del documento: meta, título y hojas de estilo —— -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronoCore · Informes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="../global/css/kons.css" rel="stylesheet" />
  <link href="../global/css/kons_app_theme.css" rel="stylesheet" />
  <link href="../global/css/krono_widgets.css" rel="stylesheet" />
  <link href="../global/css/app_layout.css" rel="stylesheet" />
  <link href="css/reportes.css" rel="stylesheet" />
</head>
<body class="krono-app" data-route="/reportes">
  <!-- Shell de navegación lateral (inyectado por app_layout.js) -->
  <div id="app-shell-mount"></div>
  <!-- Contenido principal de informes y exportación -->
  <div id="page-content">
    <div class="ReportesScreen krono-scroll-page">
      <!-- Cabecera: título y descripción de la pantalla -->
      <div class="d-flex align-items-center mb-3">
        <div>
          <h2 class="krono-headline-medium mb-1">Informes y exportación</h2>
          <p class="text-muted mb-0">Resumen ejecutivo y exportables CSV para Excel o Google Sheets.</p>
        </div>
      </div>

      <!-- Tarjetas de métricas (clientes, citas, ventas, tareas) -->
      <div class="d-flex flex-wrap gap-3 mb-3" id="reportesMetrics"></div>
      <!-- Chips de resumen adicional (confirmadas, pendientes, alta prioridad) -->
      <div class="d-flex flex-wrap gap-2 mb-4" id="reportesExtraChips"></div>

      <!-- Panel de filtros para las exportaciones CSV -->
      <div class="KronoCard p-3 mb-3">
        <div class="fw-semibold mb-3">Filtros de exportación</div>
        <div class="row g-3">
          <div class="col-12 col-md-3">
            <label class="form-label krono-form-label">Desde (yyyy-mm-dd)</label>
            <input type="date" class="form-control krono-form-control" id="reportesDesde" />
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label krono-form-label">Hasta (yyyy-mm-dd)</label>
            <input type="date" class="form-control krono-form-control" id="reportesHasta" />
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label krono-form-label">Estado cita</label>
            <select class="form-select krono-form-control" id="reportesEstado">
              <option value="">Todos</option>
              <option value="pendiente">Pendiente</option>
              <option value="confirmada">Confirmada</option>
              <option value="cancelada">Cancelada</option>
              <option value="noShow">No show</option>
            </select>
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label krono-form-label">Prioridad tarea</label>
            <select class="form-select krono-form-control" id="reportesPrioridad">
              <option value="">Todas</option>
              <option value="baja">Baja</option>
              <option value="media">Media</option>
              <option value="alta">Alta</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Botones de exportación por entidad -->
      <div class="d-flex flex-wrap gap-2 mb-3">
        <button class="btn btn-krono-primary" id="btnExportClientes">Exportar clientes</button>
        <button class="btn btn-krono-primary" id="btnExportCitas">Exportar citas</button>
        <button class="btn btn-krono-primary" id="btnExportVentas">Exportar ventas</button>
        <button class="btn btn-krono-primary" id="btnExportTareas">Exportar tareas</button>
      </div>

      <div class="text-muted small">Los CSV se descargan directamente como archivo para que puedas adjuntarlos en la memoria del TFG o abrirlos en Excel.</div>
    </div>
  </div>

  <!-- Dependencias globales y controlador de reportes -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../global/js/models.js"></script>
  <script src="../global/js/session.js"></script>
  <script src="../global/js/api_client.js"></script>
  <script src="../global/js/krono_widgets.js"></script>
  <script src="../global/js/app_layout.js"></script>
  <script src="js/reportes_controller.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAppShell();
      initReportesScreen();
    });
  </script>
</body>
</html>
