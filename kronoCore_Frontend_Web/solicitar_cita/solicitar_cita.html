<!-- Flujo guiado para que el cliente final solicite una cita (wizard de 5 pasos). -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronoCore · Solicitar cita</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="../global/css/kons.css" rel="stylesheet" />
  <link href="../global/css/kons_app_theme.css" rel="stylesheet" />
  <link href="../global/css/krono_widgets.css" rel="stylesheet" />
  <link href="../global/css/app_layout.css" rel="stylesheet" />
  <link href="css/solicitar_cita.css" rel="stylesheet" />
</head>
<body class="krono-app" data-route="/area-cliente/solicitar">
  <div id="app-shell-mount"></div>
  <div id="page-content">
    <div class="SolicitarCitaScreen krono-scroll-page">
      <h2 class="krono-headline-medium">Solicitar cita</h2>
      <!-- Contenedor del stepper: todo el wizard se genera en solicitar_cita_screen_controller.js -->
      <div class="SolicitarCitaScreen-stepper mt-4" id="solicitarStepper"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../global/js/models.js"></script>
  <script src="../global/js/api_client.js"></script>
  <script src="../global/js/session.js"></script>
  <script src="../global/js/krono_widgets.js"></script>
  <script src="../global/js/app_layout.js"></script>
  <script src="js/solicitar_cita_screen_controller.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAppShell();
      initSolicitarCitaScreen();
    });
  </script>
</body>
</html>
