<!-- =============================================================================
     Pantalla de Gastos — KronoCore Frontend Web
     Registro y control de gastos del negocio.
     ============================================================================= -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronoCore · Gastos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="../global/css/kons.css" rel="stylesheet" />
  <link href="../global/css/kons_app_theme.css" rel="stylesheet" />
  <link href="../global/css/krono_widgets.css" rel="stylesheet" />
  <link href="../global/css/app_layout.css" rel="stylesheet" />
  <link href="css/gastos.css" rel="stylesheet" />
</head>
<body class="krono-app" data-route="/gastos">
  <div id="app-shell-mount"></div>
  <div id="page-content">
    <div class="GastosScreen krono-scroll-page">
      <div class="d-flex flex-row align-items-center mb-3 flex-wrap gap-2">
        <h2 class="krono-headline-medium mb-0">Gastos</h2>
        <div class="flex-fill"></div>
        <button type="button" class="btn btn-krono-primary" id="btnNuevoGasto">
          <span class="material-symbols-outlined me-1" style="font-size:18px;vertical-align:middle">add</span>
          Nuevo gasto
        </button>
      </div>

      <div class="d-flex flex-row align-items-center mb-3 gap-2 flex-wrap">
        <div style="max-width:250px;">
          <input type="text" class="form-control krono-form-control" id="searchGasto" placeholder="Buscar gasto..." />
        </div>
        <select class="form-select krono-form-select" id="filtroCategoria" style="max-width:180px">
          <option value="">Todas las categorías</option>
          <option value="alquiler">Alquiler</option>
          <option value="suministros">Suministros</option>
          <option value="proveedores">Proveedores</option>
          <option value="marketing">Marketing</option>
          <option value="otros">Otros</option>
        </select>
      </div>

      <div class="row g-3 mb-3" id="resumenGastos"></div>
      <div id="gastosTableWrap"></div>
    </div>
  </div>

  <!-- Modal: Nuevo/Editar Gasto -->
  <div class="modal fade" id="gastoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="gastoModalTitle">Nuevo Gasto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="gastoId" />
          <div class="mb-2">
            <label class="form-label krono-form-label">Descripción</label>
            <input type="text" class="form-control krono-form-control" id="gastoDescripcion" />
          </div>
          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label krono-form-label">Categoría</label>
              <select class="form-select krono-form-select" id="gastoCategoria">
                <option value="alquiler">Alquiler</option>
                <option value="suministros">Suministros</option>
                <option value="proveedores">Proveedores</option>
                <option value="marketing">Marketing</option>
                <option value="otros">Otros</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label krono-form-label">Proveedor</label>
              <input type="text" class="form-control krono-form-control" id="gastoProveedor" />
            </div>
          </div>
          <div class="row g-2 mt-1">
            <div class="col-md-4">
              <label class="form-label krono-form-label">Importe</label>
              <input type="number" class="form-control krono-form-control" id="gastoImporte" step="0.01" />
            </div>
            <div class="col-md-3">
              <label class="form-label krono-form-label">IVA %</label>
              <select class="form-select krono-form-select" id="gastoIvaPct">
                <option value="21">21%</option>
                <option value="10">10%</option>
                <option value="4">4%</option>
              </select>
            </div>
            <div class="col-md-5">
              <label class="form-label krono-form-label">IVA Importe</label>
              <input type="text" class="form-control krono-form-control" id="gastoIvaImp" readonly />
            </div>
          </div>
          <div class="row g-2 mt-1">
            <div class="col-md-5">
              <label class="form-label krono-form-label">Total</label>
              <input type="text" class="form-control krono-form-control" id="gastoTotal" readonly />
            </div>
            <div class="col-md-5">
              <label class="form-label krono-form-label">Método pago</label>
              <select class="form-select krono-form-select" id="gastoMetodo">
                <option value="tarjeta">Tarjeta</option>
                <option value="efectivo">Efectivo</option>
                <option value="transferencia">Transferencia</option>
                <option value="bizum">Bizum</option>
              </select>
            </div>
            <div class="col-md-2" style="display:flex;align-items:center;padding-top:22px;">
              <input type="date" class="form-control krono-form-control" id="gastoFecha" />
            </div>
          </div>
          <div class="mt-2">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="gastoDeducible" checked />
              <label class="form-check-label krono-form-label" for="gastoDeducible">Deducible fiscalmente</label>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-krono-text" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-krono-primary" id="btnSaveGasto">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../global/js/models.js"></script>
  <script src="../global/js/session.js"></script>
  <script src="../global/js/api_client.js"></script>
  <script src="../global/js/krono_widgets.js"></script>
  <script src="../global/js/app_layout.js"></script>
  <script src="js/gastos_controller.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAppShell();
      initGastosScreen();
    });
  </script>
</body>
</html>
