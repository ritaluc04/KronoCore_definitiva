<!-- =============================================================================
     Pantalla Board (Kanban) — KronoCore Frontend Web
     Tablero de tareas por columnas con arrastrar y soltar.
     ============================================================================= -->
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronoCore · Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet" />
  <link href="../global/css/kons.css" rel="stylesheet" />
  <link href="../global/css/kons_app_theme.css" rel="stylesheet" />
  <link href="../global/css/krono_widgets.css" rel="stylesheet" />
  <link href="../global/css/app_layout.css" rel="stylesheet" />
  <link href="css/board.css" rel="stylesheet" />
</head>

<body class="krono-app" data-route="/board">
  <!-- Shell de navegación lateral (inyectado por app_layout.js) -->
  <div id="app-shell-mount"></div>
  <!-- Contenido principal del tablero Kanban -->
  <div id="page-content">
    <div class="BoardScreen krono-scroll-page d-flex flex-column">
      <!-- Cabecera: título y acciones (nueva columna, filtros) -->
      <div class="d-flex flex-row align-items-center mb-3">
        <h2 class="krono-headline-medium mb-0">Board</h2>
        <div class="flex-fill"></div>
        <button type="button" class="btn btn-krono-outlined me-2" id="boardBtnNuevaColumna">
          <span class="material-symbols-outlined me-1" style="font-size:18px;vertical-align:middle">view_column</span>
          Nueva Columna
        </button>
        <button type="button" class="btn btn-krono-outlined" id="boardBtnFiltros">
          <span class="material-symbols-outlined me-1" style="font-size:18px;vertical-align:middle">filter_list</span>
          Filtros
        </button>
      </div>
      <!-- Área del tablero: columnas y tarjetas (renderizado por board_controller.js) -->
      <div class="BoardScreen-board flex-fill" id="boardMount"></div>
    </div>
  </div>

  <!-- Modal: crear nueva columna en el tablero -->
  <div class="modal fade" id="columnModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nueva columna</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label krono-form-label" for="columnNombre">Nombre de la columna*</label>
            <input type="text" class="form-control krono-form-control" id="columnNombre" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-krono-text" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-krono-primary" id="btnSaveColumn">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: crear nueva tarea -->
  <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nueva tarea</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="taskEstado" />
          <div class="mb-2">
            <label class="form-label krono-form-label" for="taskTitulo">Título*</label>
            <input type="text" class="form-control krono-form-control" id="taskTitulo" />
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label" for="taskDescripcion">Descripción</label>
            <textarea class="form-control krono-form-control" id="taskDescripcion" rows="3"></textarea>
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label" for="taskImagenUrl">Imagen o URL</label>
            <input type="text" class="form-control krono-form-control" id="taskImagenUrl" placeholder="https://..." />
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label" for="taskColor">Color</label>
            <input type="color" class="form-control form-control-color" id="taskColor" value="#1d4ed8" />
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label" for="taskAsignado">Asignado a</label>
            <select class="form-select krono-form-control" id="taskAsignado">
              <option value="">Sin asignar</option>
              <option value="Marta Vidal">Marta Vidal</option>
              <option value="David López">David López</option>
              <option value="Carla Ruiz">Carla Ruiz</option>
              <option value="Pedro Bel">Pedro Bel</option>
            </select>
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label krono-form-label" for="taskPrioridad">Prioridad</label>
              <select class="form-select krono-form-control" id="taskPrioridad">
                <option value="baja">Baja</option>
                <option value="media" selected>Media</option>
                <option value="alta">Alta</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label krono-form-label" for="taskEstadoText">Estado</label>
              <input type="text" class="form-control krono-form-control" id="taskEstadoText" disabled />
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-krono-text" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-krono-primary" id="btnSaveTask">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: editar tarea existente -->
  <div class="modal fade" id="taskEditModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar tarea</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editTaskId" />
          <div class="mb-2">
            <label class="form-label krono-form-label" for="editTaskTitulo">Título*</label>
            <input type="text" class="form-control krono-form-control" id="editTaskTitulo" />
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label" for="editTaskDescripcion">Descripción</label>
            <textarea class="form-control krono-form-control" id="editTaskDescripcion" rows="3"></textarea>
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label" for="editTaskImagenUrl">Imagen o URL</label>
            <input type="text" class="form-control krono-form-control" id="editTaskImagenUrl"
              placeholder="https://..." />
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label" for="editTaskColor">Color</label>
            <input type="color" class="form-control form-control-color" id="editTaskColor" value="#1d4ed8" />
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label" for="editTaskAsignado">Asignado a</label>
            <select class="form-select krono-form-control" id="editTaskAsignado">
              <option value="">Sin asignar</option>
              <option value="Marta Vidal">Marta Vidal</option>
              <option value="David López">David López</option>
              <option value="Carla Ruiz">Carla Ruiz</option>
              <option value="Pedro Bel">Pedro Bel</option>
            </select>
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label krono-form-label" for="editTaskPrioridad">Prioridad</label>
              <select class="form-select krono-form-control" id="editTaskPrioridad">
                <option value="baja">Baja</option>
                <option value="media" selected>Media</option>
                <option value="alta">Alta</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label krono-form-label" for="editTaskEstado">Estado</label>
              <select class="form-select krono-form-control" id="editTaskEstado">
                <option value="pendiente">Pendiente</option>
                <option value="enProceso">En proceso</option>
                <option value="finalizado">Finalizado</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-danger me-auto" id="btnDeleteTask">
            <span class="material-symbols-outlined me-1"
              style="font-size:18px;vertical-align:middle">delete</span>Eliminar
          </button>
          <button type="button" class="btn btn-krono-text" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-krono-primary" id="btnUpdateTask">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dependencias globales y controlador del tablero -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../global/js/models.js"></script>
  <script src="../global/js/session.js"></script>
  <script src="../global/js/api_client.js"></script>
  <script src="../global/js/krono_widgets.js"></script>
  <script src="../global/js/app_layout.js"></script>
  <script src="js/board_controller.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAppShell();
      initBoardScreen();
    });
  </script>
</body>

</html>
