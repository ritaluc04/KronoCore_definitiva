<!--
  dashboard/dashboard.html
  Panel principal operativo tras el login (roles internos).
  Muestra métricas del día, gráfica de ventas y feed de actividad reciente.
  El shell de navegación se monta en #app-shell-mount vía app_layout.js.
-->
<!DOCTYPE html>
<html lang="es">
<!-- Cabecera: estilos globales, layout y hoja específica del dashboard -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronoCore · Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="../global/css/kons.css" rel="stylesheet" />
  <link href="../global/css/kons_app_theme.css" rel="stylesheet" />
  <link href="../global/css/krono_widgets.css" rel="stylesheet" />
  <link href="../global/css/app_layout.css" rel="stylesheet" />
  <link href="css/dashboard.css" rel="stylesheet" />
</head>
<body class="krono-app" data-route="/dashboard">
  <!-- Barra lateral y cabecera de la aplicación (generadas por JS) -->
  <div id="app-shell-mount"></div>
  <!-- Contenido propio de esta página dentro del layout -->
  <div id="page-content">
    <div class="DashboardScreen">
      <h2 class="krono-headline-medium">Buenos días 👋</h2>
      <p class="text-muted mb-0" style="margin-top:4px">Resumen operativo de hoy</p>

      <!-- Tarjetas de métricas: se rellenan dinámicamente en dashboard_page.js -->
      <div id="metricsWrap" class="d-flex flex-row flex-wrap gap-3 DashboardScreen-metrics my-4"></div>

      <!-- Fila: gráfica de ventas (8 cols) + actividad reciente (4 cols) -->
      <div class="row g-3" id="chartRow">
        <div class="col-lg-8">
          <div class="KronoCard">
            <div class="d-flex flex-row align-items-center mb-3">
              <span class="krono-title-medium">Ventas (últimos 7 días)</span>
              <div class="flex-fill"></div>
              <!-- Chip de tendencia; se sustituye al cargar la página -->
              <span id="chartChip"></span>
            </div>
            <!-- Chips secundarios (citas confirmadas, tareas alta prioridad) -->
            <div id="chartExtraChips" class="d-flex flex-row align-items-center mb-3"></div>
            <div class="DashboardScreen-chartWrap">
              <!-- Canvas para Chart.js: ventas últimos 7 días -->
              <canvas id="ventasChart"></canvas>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <!-- Lista de ventas y citas recientes -->
          <div class="KronoCard" id="activityFeed"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart.js, widgets Krono, layout y lógica del dashboard -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="../global/js/models.js"></script>
  <script src="../global/js/session.js"></script>
  <script src="../global/js/api_client.js"></script>
  <script src="../global/js/krono_widgets.js"></script>
  <script src="../global/js/app_layout.js"></script>
  <script src="js/dashboard_page.js"></script>
  <!-- Inicialización: chip de ejemplo, shell de app y carga de datos del dashboard -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('chartChip').outerHTML = htmlStatusChip('+18% vs prev.', 'var(--krono-success)', 'trending_up');
      initAppShell();
      initDashboardPage();
    });
  </script>
</body>
</html>
