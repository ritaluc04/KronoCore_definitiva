<!-- Pantalla de agenda diaria de citas con calendario por horas y alta por modal. -->
<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Metadatos, estilos globales y hoja de estilos del calendario de citas -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronoCore · Citas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="../global/css/kons.css" rel="stylesheet" />
  <link href="../global/css/kons_app_theme.css" rel="stylesheet" />
  <link href="../global/css/krono_widgets.css" rel="stylesheet" />
  <link href="../global/css/app_layout.css" rel="stylesheet" />
  <link href="css/citas.css" rel="stylesheet" />
</head>
<body class="krono-app" data-route="/citas">
  <div id="app-shell-mount"></div>
  <div id="page-content">
    <div class="CitasScreen krono-scroll-page">
      <!-- Cabecera: título y botón para abrir modal de nueva cita -->
      <div class="d-flex flex-row align-items-center mb-2">
        <h2 class="krono-headline-medium mb-0">Citas</h2>
        <div class="flex-fill"></div>
        <button type="button" class="btn btn-krono-primary" id="btnNuevaCita">
          <span class="material-symbols-outlined me-1" style="font-size:18px;vertical-align:middle">add</span>
          Nueva cita
        </button>
      </div>
      <!-- Navegación por día: anterior, etiqueta, siguiente, «Hoy» y leyenda de estados -->
      <div class="d-flex flex-row flex-wrap align-items-center gap-2 mb-3">
        <button type="button" class="btn btn-link p-1" id="btnPrevDay" aria-label="Día anterior">
          <span class="material-symbols-outlined">chevron_left</span>
        </button>
        <span id="citasDayLabel" class="fw-semibold"></span>
        <button type="button" class="btn btn-link p-1" id="btnNextDay" aria-label="Día siguiente">
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
        <button type="button" class="btn btn-krono-outlined btn-sm ms-2" id="btnHoy">
          <span class="material-symbols-outlined me-1" style="font-size:16px">today</span>
          Hoy
        </button>
        <div class="flex-fill"></div>
        <div class="d-flex flex-wrap gap-2" id="citasLegend"></div>
      </div>
      <!-- Calendario horario del día seleccionado (generado por CitasController.render) -->
      <div id="citasCalendarWrap"></div>
    </div>
  </div>

  <!-- Modal: formulario para crear una cita (POST /citas) -->
  <div class="modal fade" id="nuevaCitaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nueva cita</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label krono-form-label" for="citaClienteNombre">Cliente*</label>
            <select class="form-select krono-form-control" id="citaClienteNombre">
              <option value="">Seleccionar cliente...</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label" for="citaEmpresa">Empresa</label>
            <input type="text" class="form-control krono-form-control" id="citaEmpresa" readonly />
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label" for="citaServicio">Servicio*</label>
            <input type="text" class="form-control krono-form-control" id="citaServicio" />
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label" for="citaEmpleado">Empleado</label>
            <select class="form-select krono-form-control" id="citaEmpleado">
              <option value="">Sin asignar</option>
            </select>
          </div>
          <div class="row g-2">
            <div class="col-8">
              <label class="form-label krono-form-label" for="citaInicio">Inicio*</label>
              <input type="datetime-local" class="form-control krono-form-control" id="citaInicio" />
            </div>
            <div class="col-4">
              <label class="form-label krono-form-label" for="citaDuracion">Minutos</label>
              <input type="number" class="form-control krono-form-control" id="citaDuracion" min="15" step="15" value="30" />
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-krono-text text-danger d-none me-auto" id="btnBorrarCita">Eliminar</button>
          <button type="button" class="btn btn-krono-text" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-krono-primary" id="btnGuardarCita">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../global/js/models.js"></script>
  <script src="../global/js/session.js"></script>
  <script src="../global/js/api_client.js"></script>
  <script src="../global/js/krono_widgets.js"></script>
  <script src="../global/js/app_layout.js"></script>
<script src="js/citas_screen_controller.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAppShell();
      initCitasScreen();
    });
  </script>
</body>
</html>
