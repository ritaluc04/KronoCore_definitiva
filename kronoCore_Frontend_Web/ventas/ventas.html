<!-- =============================================================================
     Pantalla de Ventas (TPV) — KronoCore Frontend Web
     Punto de venta: catálogo de productos, carrito y cobro.
     ============================================================================= -->
<!DOCTYPE html>
<html lang="es">
<!-- —— Cabecera del documento: meta, título y hojas de estilo —— -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronoCore · Ventas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="../global/css/kons.css" rel="stylesheet" />
  <link href="../global/css/kons_app_theme.css" rel="stylesheet" />
  <link href="../global/css/krono_widgets.css" rel="stylesheet" />
  <link href="../global/css/app_layout.css" rel="stylesheet" />
  <link href="css/ventas.css" rel="stylesheet" />
</head>
<body class="krono-app" data-route="/ventas">
  <!-- Shell de navegación lateral (inyectado por app_layout.js) -->
  <div id="app-shell-mount"></div>
  <!-- Contenido principal del punto de venta -->
  <div id="page-content">
    <div class="VentasScreen krono-scroll-page ventas--productos" id="ventasRoot">
      <!-- Pestañas móviles: alternar entre productos y carrito -->
      <ul class="nav nav-tabs VentasScreen-mobileTabs d-lg-none mb-2" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" type="button" data-ventas-tab="productos">Productos</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" type="button" data-ventas-tab="carrito">Carrito</button>
        </li>
      </ul>
      <!-- Layout principal: catálogo de productos + panel del carrito -->
      <div class="VentasScreen-row d-flex flex-column flex-lg-row gap-lg-0">
        <!-- Catálogo y buscador de productos -->
        <div class="VentasScreen-products flex-grow-1" id="ventasProductsWrap">
          <div class="p-3">
            <input type="search" class="form-control krono-form-control" id="ventasSearch" placeholder="Buscar producto" />
          </div>
          <div class="VentasScreen-grid px-3 pb-3" id="ventasProductGrid"></div>
        </div>
        <!-- Panel lateral del carrito de compra -->
        <div class="VentasScreen-cartWrap flex-shrink-0" id="ventasCartWrap">
          <div class="VentasScreen-cartInner" id="ventasCartInner"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de confirmación de cobro -->
  <div class="modal fade" id="ventasCobroModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Cobrar</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0" id="ventasCobroTotal"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-krono-text" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-krono-primary" id="ventasConfirmarPago">Confirmar pago</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dependencias globales y controlador del TPV -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../global/js/models.js"></script>
  <script src="../global/js/session.js"></script>
  <script src="../global/js/api_client.js"></script>
  <script src="../global/js/krono_widgets.js"></script>
  <script src="../global/js/app_layout.js"></script>
  <script src="js/ventas_controller.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAppShell();
      initVentasScreen();
    });
  </script>
</body>
</html>
