<!--
  login/login.html
  Pantalla de autenticación de KronoCore (web).
  Incluye formulario de inicio de sesión y registro de nuevos usuarios.
  La lógica de envío y validación vive en js/login_controller.js.
-->
<!DOCTYPE html>
<html lang="es">
<!-- Cabecera: metadatos, título y hojas de estilo globales + login -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronoCore · Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="../global/css/kons.css" rel="stylesheet" />
  <link href="../global/css/kons_app_theme.css" rel="stylesheet" />
  <link href="css/login.css" rel="stylesheet" />
</head>
<!-- Contenedor principal centrado con tarjeta de login/registro -->
<body class="krono-app" data-route="/login">
  <div class="LoginScreen">
    <div class="LoginScreen-card">
      <!-- Formulario de inicio de sesión (visible por defecto) -->
      <form id="loginForm">
        <div class="text-center mb-4">
          <div class="LoginScreen-logo mx-auto">
            <span class="material-symbols-outlined">schedule</span>
          </div>
          <h1 class="LoginScreen-title">KronoCore</h1>
          <p class="LoginScreen-subtitle mb-0">Inicia sesión en tu cuenta</p>
        </div>

        <!-- Mensajes de error, éxito o confirmación de cuenta -->
        <div id="loginAlert" class="alert alert-info d-none" role="alert"></div>

        <!-- Campo email con validación HTML5 -->
        <div class="mb-3">
          <label for="email" class="form-label krono-form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><span class="material-symbols-outlined" style="font-size:20px;color:var(--krono-muted)">mail</span></span>
            <input type="email" class="form-control krono-form-control border-start-0" id="email" />
          </div>
        </div>

        <!-- Campo contraseña -->
        <div class="mb-4">
          <label for="password" class="form-label krono-form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><span class="material-symbols-outlined" style="font-size:20px;color:var(--krono-muted)">lock</span></span>
            <input type="password" class="form-control krono-form-control border-start-0" id="password" />
          </div>
        </div>

        <button type="submit" class="btn btn-krono-primary w-100" id="btnLogin">Iniciar sesión</button>

        <!-- Enlaces secundarios: recuperar contraseña y cambiar a registro -->
        <div class="d-flex flex-row justify-content-between mt-3">
          <button type="button" class="btn btn-krono-text">¿Olvidaste tu contraseña?</button>
          <button type="button" class="btn btn-krono-text" id="btnShowRegister">Crear cuenta</button>
        </div>
      </form>

      <!-- Formulario de registro (oculto hasta pulsar "Crear cuenta") -->
      <form id="registerForm" class="d-none">
        <div class="text-center mb-4">
          <div class="LoginScreen-logo mx-auto">
            <span class="material-symbols-outlined">person_add</span>
          </div>
          <h1 class="LoginScreen-title">Crear cuenta</h1>
          <p class="LoginScreen-subtitle mb-0">Únete a KronoCore</p>
        </div>

        <div id="registerAlert" class="alert alert-info d-none" role="alert"></div>

        <!-- Datos personales del nuevo usuario -->
        <div class="mb-3">
          <label for="regNombre" class="form-label krono-form-label">Nombre completo</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><span class="material-symbols-outlined" style="font-size:20px;color:var(--krono-muted)">person</span></span>
            <input type="text" class="form-control krono-form-control border-start-0" id="regNombre" />
          </div>
        </div>

        <div class="mb-3">
          <label for="regEmail" class="form-label krono-form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><span class="material-symbols-outlined" style="font-size:20px;color:var(--krono-muted)">mail</span></span>
            <input type="email" class="form-control krono-form-control border-start-0" id="regEmail" />
          </div>
        </div>

        <div class="mb-3">
          <label for="regRole" class="form-label krono-form-label">Tipo de cuenta</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><span class="material-symbols-outlined" style="font-size:20px;color:var(--krono-muted)">badge</span></span>
            <select class="form-select krono-form-control border-start-0" id="regRole">
              <option value="cliente">Cliente</option>
              <option value="empleado">Empleado</option>
              <option value="jefe">Jefe</option>
            </select>
          </div>
        </div>

        <!-- Empresa: obligatoria para jefe/empleado; se oculta si el rol es cliente -->
        <div class="mb-3" id="regCompanyWrap">
          <label for="regCompany" class="form-label krono-form-label">Empresa</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><span class="material-symbols-outlined" style="font-size:20px;color:var(--krono-muted)">business</span></span>
            <input type="text" class="form-control krono-form-control border-start-0" id="regCompany" placeholder="Nombre de la empresa o negocio" />
          </div>
          <div class="form-text">Obligatoria para jefe y empleado.</div>
        </div>

        <div class="mb-3">
          <label for="regTelefono" class="form-label krono-form-label">Teléfono</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><span class="material-symbols-outlined" style="font-size:20px;color:var(--krono-muted)">phone</span></span>
            <input type="tel" class="form-control krono-form-control border-start-0" id="regTelefono" />
          </div>
        </div>

        <div class="mb-4">
          <label for="regPassword" class="form-label krono-form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><span class="material-symbols-outlined" style="font-size:20px;color:var(--krono-muted)">lock</span></span>
            <input type="password" class="form-control krono-form-control border-start-0" id="regPassword" />
          </div>
        </div>

        <button type="submit" class="btn btn-krono-primary w-100" id="btnRegister">Registrarse</button>

        <div class="text-center mt-3">
          <button type="button" class="btn btn-krono-text" id="btnShowLogin">¿Ya tienes cuenta? Inicia sesión</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Dependencias: Bootstrap, modelos globales, API, sesión y controlador de login -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../global/js/models.js"></script>
  <script src="../global/js/api_client.js"></script>
  <script src="../global/js/session.js"></script>
  <script src="js/login_controller.js"></script>
  <!-- Arranque del controlador cuando el DOM está listo -->
  <script>document.addEventListener('DOMContentLoaded', initLoginPage);</script>
</body>
</html>
