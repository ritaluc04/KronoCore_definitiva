<!-- =============================================================================
     Pantalla de Inventario — KronoCore Frontend Web
     Gestión de productos: listado, búsqueda, alta/edición y eliminación.
     ============================================================================= -->
<!DOCTYPE html>
<html lang="es">
<!-- —— Cabecera del documento: meta, título y hojas de estilo —— -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronoCore · Inventario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="../global/css/kons.css" rel="stylesheet" />
  <link href="../global/css/kons_app_theme.css" rel="stylesheet" />
  <link href="../global/css/krono_widgets.css" rel="stylesheet" />
  <link href="../global/css/app_layout.css" rel="stylesheet" />
  <link href="css/inventario.css" rel="stylesheet" />
</head>
<body class="krono-app" data-route="/inventario">
  <!-- Shell de navegación lateral (inyectado por app_layout.js) -->
  <div id="app-shell-mount"></div>
  <!-- Contenido principal de la pantalla de inventario -->
  <div id="page-content">
    <div class="InventarioScreen krono-scroll-page">
      <!-- Cabecera: título y acciones (filtrar stock bajo, exportar CSV, importar CSV, nuevo producto) -->
      <div class="d-flex flex-row align-items-center mb-3 flex-wrap gap-2">
        <h2 class="krono-headline-medium mb-0">Inventario</h2>
        <div class="flex-fill"></div>
        <button type="button" class="btn btn-krono-outlined me-2" id="btnFiltrarStockBajo">
          <span class="material-symbols-outlined me-1" style="font-size:18px;vertical-align:middle">inventory_2</span>
          Filtrar stock bajo
        </button>
        <button type="button" class="btn btn-krono-outlined me-2" id="btnExportarCSV">
          <span class="material-symbols-outlined me-1" style="font-size:18px;vertical-align:middle">download</span>
          Exportar CSV
        </button>
        <button type="button" class="btn btn-krono-outlined me-2" id="btnImportarCSV">
          <span class="material-symbols-outlined me-1" style="font-size:18px;vertical-align:middle">upload_file</span>
          Importar CSV
        </button>
        <button type="button" class="btn btn-krono-primary" id="btnNuevoProducto">
          <span class="material-symbols-outlined me-1" style="font-size:18px;vertical-align:middle">add</span>
          Nuevo producto
        </button>
      </div>

      <!-- Campo de búsqueda por nombre, SKU o categoría -->
      <div class="mb-3" style="max-width: 300px;">
        <label class="form-label krono-form-label d-none">Buscar producto</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><span class="material-symbols-outlined text-muted" style="font-size: 20px;">search</span></span>
          <input type="text" class="form-control krono-form-control border-start-0 ps-0" id="searchProducto" placeholder="Buscar producto..." />
        </div>
      </div>

      <!-- Listado de productos (renderizado dinámicamente por inventario_screen_controller.js) -->
      <div id="inventarioTableWrap"></div>
    </div>
  </div>

  <!-- Modal: formulario de creación y edición de producto -->
  <div class="modal fade" id="productoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="productoModalTitle">Nuevo Producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="prodId" />
          <div class="mb-2">
            <label class="form-label krono-form-label">SKU</label>
            <input type="text" class="form-control krono-form-control" id="prodSku" />
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label">Nombre</label>
            <input type="text" class="form-control krono-form-control" id="prodNombre" />
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label">Categoría</label>
            <input type="text" class="form-control krono-form-control" id="prodCat" />
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label">Precio</label>
            <input type="number" class="form-control krono-form-control" id="prodPrecio" step="0.01" />
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label">Stock Actual</label>
            <input type="number" class="form-control krono-form-control" id="prodStock" />
          </div>
          <div class="mb-0">
            <label class="form-label krono-form-label">Stock Mínimo</label>
            <input type="number" class="form-control krono-form-control" id="prodStockMin" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-krono-text" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-krono-primary" id="btnGuardarProducto">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dependencias globales y controlador de la pantalla -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../global/js/models.js"></script>
  <script src="../global/js/session.js"></script>
  <script src="../global/js/api_client.js"></script>
  <script src="../global/js/krono_widgets.js"></script>
  <script src="../global/js/app_layout.js"></script>
<script src="js/inventario_screen_controller.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAppShell();
      initInventarioScreen();
    });
  </script>
</body>
</html>
