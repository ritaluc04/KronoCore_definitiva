<!-- Pantalla web de listado y alta de clientes (KronoCore). -->
<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Metadatos, estilos globales de la app y hoja de estilos de esta pantalla -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronoCore · Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="../global/css/kons.css" rel="stylesheet" />
  <link href="../global/css/kons_app_theme.css" rel="stylesheet" />
  <link href="../global/css/krono_widgets.css" rel="stylesheet" />
  <link href="../global/css/app_layout.css" rel="stylesheet" />
  <link href="css/clientes.css" rel="stylesheet" />
</head>
<body class="krono-app" data-route="/clientes">
  <!-- Contenedor del layout compartido (menú lateral, cabecera, etc.) -->
  <div id="app-shell-mount"></div>
  <!-- Contenido principal: cabecera, búsqueda y lista dinámica de clientes -->
  <div id="page-content">
    <div class="ClientesScreen krono-scroll-page">
      <!-- Título de pantalla y acción para abrir el modal de nuevo cliente -->
      <div class="d-flex flex-row align-items-center mb-3">
        <h2 class="krono-headline-medium mb-0">Clientes</h2>
        <div class="flex-fill"></div>
        <button type="button" class="btn btn-krono-primary" id="btnNuevoCliente">
          <span class="material-symbols-outlined me-1" style="font-size:18px;vertical-align:middle">add</span>
          Nuevo cliente
        </button>
      </div>
      <!-- Barra de búsqueda y botón de filtros (filtros aún sin lógica en JS) -->
      <div class="d-flex flex-row flex-wrap gap-2 mb-3">
        <div class="ClientesScreen-search">
          <span class="material-symbols-outlined ClientesScreen-searchIcon">search</span>
          <input type="search" class="form-control krono-form-control" id="searchClientes" placeholder="Buscar por nombre o email" />
        </div>
        <button type="button" class="btn btn-krono-outlined">
          <span class="material-symbols-outlined me-1" style="font-size:18px;vertical-align:middle">filter_list</span>
          Filtros
        </button>
      </div>
      <!-- Aquí clientes_screen_controller.js inserta la tabla o estados vacío/error -->
      <div id="clientesListWrap"></div>
    </div>
  </div>

  <!-- Modal Bootstrap: formulario de creación de cliente -->
  <div class="modal fade" id="newClientModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nuevo cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label krono-form-label" for="ncNombre">Nombre y Apellidos*</label>
            <input type="text" class="form-control krono-form-control" id="ncNombre" />
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label" for="ncEmail">Email</label>
            <input type="email" class="form-control krono-form-control" id="ncEmail" />
          </div>
          <div class="mb-0">
            <label class="form-label krono-form-label" for="ncTelefono">Teléfono*</label>
            <input type="tel" class="form-control krono-form-control" id="ncTelefono" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-krono-text" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-krono-primary" id="btnCrearCliente">Crear</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dependencias globales y arranque de la pantalla al cargar el DOM -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../global/js/models.js"></script>
  <script src="../global/js/session.js"></script>
  <script src="../global/js/api_client.js"></script>
  <script src="../global/js/krono_widgets.js"></script>
  <script src="../global/js/app_layout.js"></script>
  <script src="js/clientes_screen_controller.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAppShell();
      initClientesScreen();
    });
  </script>
</body>
</html>
