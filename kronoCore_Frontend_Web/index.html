<!-- =============================================================================
     index.html — Punto de entrada de la aplicación web KronoCore.
     Redirige automáticamente al formulario de inicio de sesión.
     ============================================================================= -->
<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Metadatos del documento: codificación, viewport y título de la pestaña -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronoCore</title>
  <!-- Redirección HTTP inmediata (0 s) hacia la página de login -->
  <meta http-equiv="refresh" content="0; url=login/login.html" />
</head>
<body>
  <!-- Enlace de respaldo por si la redirección automática no se ejecuta -->
  <p>Redirigiendo a <a href="login/login.html">login</a>…</p>
</body>
</html>
