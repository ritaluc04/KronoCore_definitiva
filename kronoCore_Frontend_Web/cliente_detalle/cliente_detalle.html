<!-- Pantalla de ficha de un cliente: datos, pestañas y modales de edición/eliminación. -->
<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Metadatos, estilos globales y hoja de estilos de detalle de cliente -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KronoCore · Cliente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="../global/css/kons.css" rel="stylesheet" />
  <link href="../global/css/kons_app_theme.css" rel="stylesheet" />
  <link href="../global/css/krono_widgets.css" rel="stylesheet" />
  <link href="../global/css/app_layout.css" rel="stylesheet" />
  <link href="css/cliente_detalle.css" rel="stylesheet" />
</head>
<body class="krono-app" data-route="/clientes/detalle">
  <div id="app-shell-mount"></div>
<!-- Contenedor vacío: cliente_detalle_screen_controller.js pinta cabecera, pestañas y contenido vía API -->
  <div id="page-content">
    <div class="ClienteDetalleScreen krono-scroll-page" id="clienteDetalleRoot"></div>
  </div>

  <!-- Modal de confirmación antes de borrar el cliente (DELETE /clientes/:id) -->
  <div class="modal fade" id="deleteClientModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Eliminar cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          ¿Estás seguro de que deseas eliminar este cliente?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-krono-text" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-krono-primary text-danger" style="background-color: transparent; border-color: transparent;" id="btnConfirmDelete">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de edición de datos básicos (PUT /clientes/:id) -->
  <div class="modal fade" id="editClientModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label krono-form-label" for="ecNombre">Nombre y Apellidos*</label>
            <input type="text" class="form-control krono-form-control" id="ecNombre" />
          </div>
          <div class="mb-2">
            <label class="form-label krono-form-label" for="ecEmail">Email</label>
            <input type="email" class="form-control krono-form-control" id="ecEmail" />
          </div>
          <div class="mb-0">
            <label class="form-label krono-form-label" for="ecTelefono">Teléfono*</label>
            <input type="tel" class="form-control krono-form-control" id="ecTelefono" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-krono-text" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-krono-primary" id="btnConfirmEdit">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../global/js/models.js"></script>
  <script src="../global/js/session.js"></script>
  <script src="../global/js/api_client.js"></script>
  <script src="../global/js/krono_widgets.js"></script>
  <script src="../global/js/app_layout.js"></script>
<script src="js/cliente_detalle_screen_controller.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAppShell();
      initClienteDetalleScreen();
    });
  </script>
</body>
</html>
